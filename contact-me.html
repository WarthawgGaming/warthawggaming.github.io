<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Warthawg Gaming for questions, suggestions, collaboration ideas, or plugin feedback.">
    <title>Warthawg Gaming - Contact Me</title>
    <link rel="icon" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="nav-wrap">
            <a class="brand" href="index.html" aria-label="Warthawg Gaming Home">
                <img src="images/logo.png" alt="Warthawg Gaming logo" class="brand-logo">
                <span class="brand-text">
                    <span class="brand-name">Warthawg Gaming</span>
                    <span class="brand-tagline">Gaming • Servers • Community</span>
                </span>
            </a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="server.html">Server</a>
                <a href="docs.html">Docs</a>
                <a href="my-projects.html">Projects</a>
                <a href="social-media.html">Social</a>
                <a class="active" href="contact-me.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-panel">
            <span class="kicker">Contact</span>
            <h1>Get in touch</h1>
            <p class="lead">Have a question, suggestion, collaboration idea, or plugin issue? Send a message below.</p>
        </section>

        <section class="card form-card">
            <form id="fs-frm" name="simple-contact-form" accept-charset="utf-8" action="https://formspree.io/f/xaygjyvg" method="post">
                <label for="full-name">Full Name</label>
                <input type="text" name="name" id="full-name" placeholder="First and Last" required>

                <label for="email-address">Email Address</label>
                <input type="email" name="_replyto" id="email-address" placeholder="email@domain.tld" required>

                <label for="message">Message</label>
                <textarea name="message" id="message" placeholder="Enter message here." required></textarea>

                <input type="hidden" name="_subject" id="email-subject" value="Warthawg Gaming Contact Form Submission">

                <div class="recaptcha-wrap">
                    <div class="g-recaptcha" data-sitekey="6LfuleonAAAAAPBRACLab--N_Z8uFXqFTV5okQoy"></div>
                </div>

                <button class="button primary" type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-wrap">
            <span>©2026 Warthawg Gaming</span>
            <span>Built with GitHub Pages</span>
        </div>
    </footer>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</body>
</html>
