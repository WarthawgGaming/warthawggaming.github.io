<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warthawg Gaming - Contact Me</title>
    <link rel="icon" href="images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            background-color: #222;
            background-image: url(images/gaming-texture.jpg);
            background-repeat: repeat;
            color: #fff;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.8;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            padding: 15px 40px;
            background-color: rgba(0, 0, 0, 0.7);
            border-bottom: 2px solid #00ff00;
        }

        .branding {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .branding-text {
            font-size: clamp(22px, 4vw, 44px);
            color: #fff;
            text-shadow: 3px 3px 0 #000;
        }

        .logo {
            width: 110px;
            max-width: 25vw;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .links a,
        input[type="submit"] {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333;
            color: #00ff00;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #00ff00;
            border-radius: 6px;
            transition: background-color 0.3s, color 0.3s;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            cursor: pointer;
        }

        .links a:hover,
        input[type="submit"]:hover {
            background-color: #00ff00;
            color: #111;
        }

        .content {
            flex: 1;
            width: min(900px, 95%);
            margin: 0 auto;
            padding: 40px 20px 50px;
        }

        .contact-card {
            background-color: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(0, 255, 0, 0.6);
            border-radius: 12px;
            padding: 25px;
            margin: 20px auto;
            box-shadow: 0 0 18px rgba(0, 255, 0, 0.18);
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
            max-width: 650px;
            margin: 0 auto;
            text-align: left;
        }

        label {
            color: #00ff00;
            font-size: 12px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #00ff00;
            border-radius: 6px;
            background-color: #111;
            color: #fff;
            font-size: 14px;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
        }

        h1, h2 {
            color: #00ff00;
            line-height: 1.5;
        }

        p {
            font-size: 13px;
        }

        .recaptcha-wrap {
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }

        footer {
            background-color: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 20px 10px;
            text-align: center;
            font-size: 11px;
        }

        @media (max-width: 800px) {
            .topbar {
                flex-direction: column;
                padding: 15px;
            }

            .branding {
                flex-direction: column;
            }

            .logo {
                width: 90px;
            }

            .links a,
            input[type="submit"] {
                font-size: 10px;
                padding: 9px 11px;
            }

            label,
            p {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="branding">
            <img src="images/logo.png" alt="Warthawg Gaming Logo" class="logo">
            <span class="branding-text">Warthawg Gaming</span>
        </div>
        <nav class="links" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="social-media.html">Social Media</a>
            <a href="my-projects.html">My Projects</a>
            <a href="contact-me.html">Contact Me</a>
        </nav>
    </header>

    <main class="content">
        <section class="contact-card">
            <h1>Contact Me</h1>
            <p>Got a question, suggestion, collaboration idea, or plugin issue? Send a message below.</p>

            <form id="fs-frm" name="simple-contact-form" accept-charset="utf-8" action="https://formspree.io/f/xaygjyvg" method="post">
                <label for="full-name">Full Name</label>
                <input type="text" name="name" id="full-name" placeholder="First and Last" required>

                <label for="email-address">Email Address</label>
                <input type="email" name="_replyto" id="email-address" placeholder="email@domain.tld" required>

                <label for="message">Message</label>
                <textarea name="message" id="message" placeholder="Enter message here." required></textarea>

                <input type="hidden" name="_subject" id="email-subject" value="Warthawg Gaming Contact Form Submission">

                <div class="recaptcha-wrap">
                    <div class="g-recaptcha" data-sitekey="6LfuleonAAAAAPBRACLab--N_Z8uFXqFTV5okQoy"></div>
                </div>

                <input type="submit" value="Submit">
            </form>
        </section>
    </main>

    <footer>
        <p>©2026 Warthawg Gaming</p>
    </footer>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</body>
</html>
